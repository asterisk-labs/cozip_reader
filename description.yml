extension:
  name: cozip
  description: Cloud-Optimized ZIP reader for DuckDB
  version: 3.0.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads"
  maintainers:
    - csaybar
    - ryali93
repo:
  github: asterisk-labs/cozip_reader
  ref: 0000000000000000000000000000000000000000
docs:
  hello_world: |
    INSTALL cozip FROM community;
    LOAD cozip;

    -- One row per file in a Flat-profile archive on Source Cooperative.
    SELECT * FROM read_flat(
      'https://data.source.coop/asterisk-labs/cozip-api-fixtures/data/cities.zip'
    ) LIMIT 10;

    -- The same archive on Hugging Face, pinned to a revision.
    SELECT * FROM read_flat(
      'hf://datasets/asterisk-labs/cozip-api-fixtures@v0.1.0/data/cities.zip'
    ) LIMIT 10;

  extended_description: |
    cozip puts an index at byte 0 of a ZIP archive, so a reader reaches any
    file inside it in one range request instead of scanning the Central
    Directory. This extension reads Flat-profile cozip archives without
    downloading them, over HTTPS, S3, GCS, Azure or Hugging Face.

    read_flat(path) returns the Flat-profile manifest: one row per entry with
    name, offset, size and whatever columns the writer added.

    cozip:location holds a GDAL /vsisubfile/ path that opens the referenced
    file in GDAL, rasterio or terra without extracting the archive. The
    original read_cozip(path, gdal_vsi := ...) API remains available.

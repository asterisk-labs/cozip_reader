version: 2

# The duckdb and extension-ci-tools submodules are pinned to the DuckDB version
# this extension is built and released against, so they are updated by hand with
# the release rather than tracked here. Only the workflow actions are automated.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
